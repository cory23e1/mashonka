<!DOCTYPE html>
<html lang="ru">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase.js"></script>
  
  <script src="script.js"></script>
  
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Школа Марины Усачевой</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css">
  </head>
  
  <body>

  <div id="login-screen">
    <div class="login-card">
      <h2>Вход</h2>
      <input type="text" id="login-input" placeholder="Логин">
      <input type="password" id="password-input" placeholder="Пароль">
      <button id="login-btn">Войти</button>
      <div class="auth-link" id="show-register">Нет аккаунта? Регистрация</div>
      <div class="error" id="login-error"></div>
    </div>
  </div>

  <!-- Экран регистрации -->
  <div id="register-screen" class="hidden">
    <div class="auth-card">
      <h2>Регистрация</h2>
      <input type="text" id="reg-fullname" placeholder="ФИО">
      <input type="text" id="reg-login" placeholder="Логин">
      <input type="password" id="reg-password" placeholder="Пароль">
      <input type="file" id="reg-avatar" accept="image/*">
      <button id="register-btn">Зарегистрироваться</button>
      <div class="auth-link" id="show-login">Уже есть аккаунт? Войти</div>
      <div class="error" id="register-error"></div>
    </div>
  </div>

  <!-- Панель преподавателя -->
  <div id="teacher-panel" class="hidden">
    <button class="logout-btn" id="teacher-logout">Выйти</button>
    <div class="left-panel">
      <h3 style="margin-bottom:20px;">Ученики</h3>
      <div id="students-list"></div>
      <div id="student-dates" class="hidden"></div>
    </div>
    <div class="right-panel">
      <h2>Кабинет преподавателя</h2>
      <div id="today-activity" style="margin: 15px 0; padding: 10px; background: #f8f9fa; border-radius: 8px;">
        <h4>Активность на сегодня</h4>
        <div id="today-lessons"></div>
      </div>
      <h3 id="calendar-title"></h3>
      <div id="calendar" class="calendar"></div>

      <div style="display:flex; gap:10px; margin-bottom:10px; margin-top:10px;">
        <button id="prev-month">Пред.месяц</button>
        <button id="next-month">След.месяц</button>
      </div>
      
      <div id="selected-date-info" class="hidden">
        <h3 id="selected-date-title"></h3>
        <div id="selected-date-lessons"></div>
      </div>
      
    </div>
  </div>

  <!-- Панель ученика -->
  <div id="student-panel" class="hidden">
    <button class="logout-btn" id="student-logout">Выйти</button>
    <div class="student-header">
      <div>
        <div class="name" id="student-name"></div>
      </div>
      <img id="student-avatar" src="" alt="Аватар">
    </div>
    <div class="upcoming-lessons">
      <h3 style="text-align:center; margin-bottom:20px;">Ближайшие занятия</h3>
      <div id="student-lessons"></div>
    </div>
  </div>

  <!-- Модальное окно для уроков на выбранную дату -->
  <!-- <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-date"></h3>
      <div id="modal-lessons"></div>
      <button id="close-modal-btn" style="margin-top:15px; padding:8px 20px; background:#e74c3c; color:white; border:none; border-radius:5px; cursor:pointer;">Закрыть</button>
    </div>
  </div> -->

  <!-- Контейнер для уведомлений -->
  <div id="toast-container"></div>
    
  </body>
</html>
